name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Check K8s manifest files exist
      run: |
        echo "Checking manifest files..."
        ls -la k8s/
        echo "✅ All manifest files found!"

    - name: Validate YAML structure
      run: |
        python3 -c "
        import yaml, sys, os
        files = os.listdir('k8s')
        for f in files:
            if f.endswith('.yaml'):
                with open(f'k8s/{f}') as file:
                    try:
                        list(yaml.safe_load_all(file))
                        print(f'✅ {f} is valid')
                    except yaml.YAMLError as e:
                        print(f'❌ {f} has error: {e}')
                        sys.exit(1)
        "

    - name: Deployment Summary
      run: |
        echo "========================================="
        echo "  Deployment Summary"
        echo "========================================="
        echo "  App Image  : nginxdemos/hello"
        echo "  Redis Image: redis:7-alpine"
        echo "  Replicas   : 2"
        echo "  Probes     : Liveness + Readiness"
        echo "========================================="
        echo "  In production this would:"
        echo "  1. Connect to real K8s cluster via kubeconfig secret"
        echo "  2. kubectl apply -f k8s/"
        echo "  3. kubectl rollout status deployment/myapp"
        echo "========================================="