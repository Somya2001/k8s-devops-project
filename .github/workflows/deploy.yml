name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install yamllint
      run: pip install yamllint

    - name: Validate YAML Syntax
      run: |
        yamllint k8s/
        echo "✅ All YAML files are valid!"

    - name: Check K8s manifest structure
      run: |
        echo "Checking manifest files..."
        for f in k8s/*.yaml; do
          echo "✅ Found: $f"
          cat $f | grep "kind:" 
        done

    - name: Deployment Summary
      run: |
        echo "========================================="
        echo "  Deployment Summary"
        echo "========================================="
        echo "  App Image  : nginxdemos/hello"
        echo "  Redis Image: redis:7-alpine"
        echo "  Replicas   : 2"
        echo "  Probes     : Liveness + Readiness"
        echo "========================================="
        echo "  In production this would:"
        echo "  1. Connect to real K8s cluster via kubeconfig secret"
        echo "  2. kubectl apply -f k8s/"
        echo "  3. kubectl rollout status deployment/myapp"
        echo "========================================="